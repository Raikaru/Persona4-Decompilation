name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Free checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-python.txt

      - name: Byte-compile Python tools
        run: python -m compileall -q tools

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON and YAML configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          paths = (
              sorted(Path("config").glob("*.json"))
              + sorted(Path("config").glob("*.yaml"))
              + sorted(Path("config").glob("*.yml"))
              + sorted(Path("tools").glob("*_config.json"))
          )
          if not paths:
              raise SystemExit("no JSON/YAML configuration files found")
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  if path.suffix == ".json":
                      json.load(stream)
                  else:
                      yaml.safe_load(stream)
              print(f"{path}: ok")
          PY

      - name: Validate committed progress snapshots
        run: python tools/progress.py --validate-dir progress

      - name: Validate CI workflow YAML
        run: python -c "import yaml,sys; yaml.safe_load(open('.github/workflows/ci.yml'))"

      - name: Validate objdiff project configuration
        run: |
          python - <<'PY'
          import json

          cfg = json.load(open("objdiff.json"))
          for unit in cfg["units"]:
              for key in ("name", "target_path", "base_path", "metadata"):
                  if key not in unit:
                      raise SystemExit(f"objdiff.json unit missing {key!r}: {unit}")
              complete = unit["metadata"].get("complete")
              if not isinstance(complete, bool):
                  raise SystemExit(f"objdiff.json unit metadata.complete must be a bool: {unit}")
              if unit["base_path"] is None and complete:
                  raise SystemExit(f"objdiff.json unit with no base cannot be complete: {unit}")
              if unit["base_path"] is not None and not isinstance(unit["base_path"], str):
                  raise SystemExit(f"objdiff.json unit base_path must be a string or null: {unit}")
          ids = {category["id"] for category in cfg.get("progress_categories", [])}
          for unit in cfg["units"]:
              for category in unit["metadata"].get("progress_categories", []):
                  if category not in ids:
                      raise SystemExit(f"objdiff.json unit references unknown category {category!r}")
          windows = json.load(open("tools/slus21782_functions.json"))["windows"]
          print(f"objdiff.json: {len(cfg['units'])} units, "
                f"{len(windows)} canonical functions, "
                f"{sum(1 for u in cfg['units'] if u['base_path'] is None)} without source")
          # Full coverage and progress categories only appear once objdiff.json
          # is regenerated by the proprietary build (make objdiff).  Until
          # then this is a warning, not a failure, so development branches
          # stay green during the transition.
          if len(cfg["units"]) != len(windows):
              print(f"WARNING: objdiff.json is stale - expected {len(windows)} units "
                    f"(regenerate with: make objdiff)")
          if not cfg.get("progress_categories"):
              print("WARNING: objdiff.json is missing progress_categories "
                    "(regenerate with: make objdiff)")
          PY

  # This detector keeps the proprietary job skipped unless the opt-in variable,
  # private dependency repository, and access token are all present.  Secrets
  # are checked in a step (rather than a job-level if), because GitHub does not
  # expose the secrets context to job conditionals.
  proprietary-inputs:
    name: Detect proprietary build inputs
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - id: detect
        name: Check opt-in and private dependency access
        env:
          P4_PROPRIETARY_BUILD: ${{ vars.P4_PROPRIETARY_BUILD }}
          P4_PRIVATE_DEPS_REPO: ${{ vars.P4_PRIVATE_DEPS_REPO }}
          P4_PRIVATE_DEPS_TOKEN: ${{ secrets.P4_PRIVATE_DEPS_TOKEN }}
        run: |
          if [ "$P4_PROPRIETARY_BUILD" = "true" ] \
              && [ -n "$P4_PRIVATE_DEPS_REPO" ] \
              && [ -n "$P4_PRIVATE_DEPS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "proprietary inputs enabled"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "proprietary inputs absent or disabled; build job will be skipped"
          fi

  # Full build and byte verification.  This is intentionally dormant on public
  # runners.  To enable it, put MWCCPS2/MWLDPS2 and SLUS_217.82 in a private
  # dependencies repository, set P4_PROPRIETARY_BUILD=true and
  # P4_PRIVATE_DEPS_REPO, add P4_PRIVATE_DEPS_TOKEN, and require approval for
  # the p4-proprietary environment.  The private repository should contain the
  # compiler files and ELF at the paths configured by the variables below.
  build-and-verify:
    name: Proprietary build and verify
    needs: [checks, proprietary-inputs]
    if: ${{ needs.proprietary-inputs.outputs.available == 'true' }}
    environment:
      name: p4-proprietary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private compiler and retail ELF
        env:
          P4_PRIVATE_DEPS_REPO: ${{ vars.P4_PRIVATE_DEPS_REPO }}
          P4_PRIVATE_DEPS_TOKEN: ${{ secrets.P4_PRIVATE_DEPS_TOKEN }}
          P4_PRIVATE_MWCC_PATH: ${{ vars.P4_PRIVATE_MWCC_PATH || 'mwccps2.exe' }}
          P4_PRIVATE_MWLD_PATH: ${{ vars.P4_PRIVATE_MWLD_PATH || 'mwldps2.exe' }}
          P4_PRIVATE_RETAIL_ELF_PATH: ${{ vars.P4_PRIVATE_RETAIL_ELF_PATH || 'SLUS_217.82' }}
        run: |
          set -eu
          private_root="$RUNNER_TEMP/p4-private"
          # Probe the API first: git's clone failure is a bare 403 that does not
          # say WHICH of the several possible causes applies, and the token is
          # masked in logs so it cannot be inspected after the fact.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${P4_PRIVATE_DEPS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${P4_PRIVATE_DEPS_REPO}")
          case "$status" in
            200) : ;;
            401) echo "::error::P4_PRIVATE_DEPS_TOKEN was rejected (401). The secret is empty, mistyped, or the token has expired/been revoked." ; exit 1 ;;
            403) echo "::error::Token authenticated but is FORBIDDEN (403) for ${P4_PRIVATE_DEPS_REPO}. For a fine-grained PAT check: Repository access = 'Only select repositories' WITH this repo selected (not 'Public repositories only'), and Permissions -> Repository -> Contents = Read-only. For a classic PAT it needs the 'repo' scope." ; exit 1 ;;
            404) echo "::error::${P4_PRIVATE_DEPS_REPO} not found (404). Either P4_PRIVATE_DEPS_REPO is wrong, or the token cannot see the repo at all - a fine-grained PAT scoped to other repositories reports 404 rather than 403." ; exit 1 ;;
            *)   echo "::error::Unexpected HTTP $status querying ${P4_PRIVATE_DEPS_REPO}." ; exit 1 ;;
          esac
          git clone --depth=1 \
            "https://x-access-token:${P4_PRIVATE_DEPS_TOKEN}@github.com/${P4_PRIVATE_DEPS_REPO}.git" \
            "$private_root"
          for f in "$P4_PRIVATE_MWCC_PATH" "$P4_PRIVATE_MWLD_PATH" "$P4_PRIVATE_RETAIL_ELF_PATH"; do
            if [ ! -f "$private_root/$f" ]; then
              echo "::error::${P4_PRIVATE_DEPS_REPO} is readable but does not contain '$f'. Repo root holds: $(ls -A "$private_root" | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "P4_PRIVATE_ROOT=$private_root" >> "$GITHUB_ENV"
          echo "P4_PRIVATE_MWCC_PATH=$P4_PRIVATE_MWCC_PATH" >> "$GITHUB_ENV"
          echo "P4_PRIVATE_MWLD_PATH=$P4_PRIVATE_MWLD_PATH" >> "$GITHUB_ENV"
          echo "P4_PRIVATE_RETAIL_ELF_PATH=$P4_PRIVATE_RETAIL_ELF_PATH" >> "$GITHUB_ENV"

      - name: Build Linux container
        run: docker build --tag p4-decomp-ci .

      - name: Setup, build, and verify with mounted proprietary inputs
        run: |
          set -eu
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work" \
            --mount "type=bind,src=$P4_PRIVATE_ROOT,dst=/opt/p4,readonly" \
            --env "P4_MWCC_BINARY=/opt/p4/$P4_PRIVATE_MWCC_PATH" \
            --env "P4_MWLD_BINARY=/opt/p4/$P4_PRIVATE_MWLD_PATH" \
            --env "P4_RETAIL_ELF=/opt/p4/$P4_PRIVATE_RETAIL_ELF_PATH" \
            --workdir /work \
            p4-decomp-ci \
            sh -c 'python tools/build.py --setup-only && make split && make && make verify && make objdiff-objects'

      # The build runs as root inside the container; objdiff-cli runs on the
      # host as the unprivileged runner user.  Several build outputs are
      # produced by atomic write (mkstemp + rename), so they land as mode 0600
      # owned by root and the host cannot even read them:
      #   Failed to open ./build/objdiff/target/nonmatchings/003dd290.o
      #   Caused by: Permission denied (os error 13)
      # Ownership is corrected here rather than by running the container with
      # --user, deliberately: the build above is byte-exact in this exact
      # configuration and changing the build UID could perturb it.
      - name: Take ownership of container-written build output
        run: |
          set -eu
          sudo chown -R "$(id -u):$(id -g)" build
          # Prove the file objdiff-cli tripped on is now readable by this user.
          unreadable=$(find build -type f ! -readable | head -5)
          if [ -n "$unreadable" ]; then
            echo "::error::still unreadable after chown:"; echo "$unreadable"
            exit 1
          fi

      - name: Download objdiff-cli
        run: |
          curl -sL -o objdiff-cli https://github.com/encounter/objdiff/releases/download/v3.7.3/objdiff-cli-linux-x86_64
          chmod +x objdiff-cli
          ./objdiff-cli --version

      - name: Generate objdiff report
        run: ./objdiff-cli report generate -o build/report.json -c functionRelocDiffs=none

      - name: Derive report artifact name from target config
        id: serial
        run: |
          serial=$(python -c "import json; print(json.load(open('config/target.json'))['serial'])")
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "report artifact will be named ${serial}_report"

      # decomp.dev consumes this artifact: it must be named exactly
      # <serial>_report (SLUS_217.82_report for the USA build).
      - name: Upload objdiff report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.serial.outputs.serial }}_report
          path: build/report.json
          if-no-files-found: error
